# MMWSS stack — separate from the existing callora stack.
# Lives on the same EC2 host but uses its own Docker network and its own Postgres.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  mmwss_net:
    name: mmwss_net
    driver: bridge
  # Attached to callora's network too so caddy (in callora stack) can reach mmwss-app
  repo_default:
    external: true

volumes:
  mmwss_pgdata:
    name: mmwss_pgdata
  mmwss_reports:
    name: mmwss_reports

services:
  db:
    image: postgres:15-alpine
    container_name: mmwss-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: mmwss
      POSTGRES_PASSWORD: ${MMWSS_DB_PASSWORD}
      POSTGRES_DB: mmwss
    volumes:
      - mmwss_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    networks:
      - mmwss_net
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmwss -d mmwss"]
      interval: 5s
      timeout: 5s
      retries: 10

  collector:
    build:
      context: ../collector
      dockerfile: Dockerfile
    image: mmwss/collector:latest
    container_name: mmwss-collector
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql://mmwss:${MMWSS_DB_PASSWORD}@db:5432/mmwss
      MMWSS_MASTER_KEY: ${MMWSS_MASTER_KEY}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      CLOUDFLARE_TOKEN_LABEL: ${CLOUDFLARE_TOKEN_LABEL:-primary}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mmwss_net
    volumes:
      - mmwss_reports:/app/reports
    deploy:
      resources:
        limits:
          memory: 256m

  app:
    build:
      context: ../app
      dockerfile: Dockerfile
    image: mmwss/app:latest
    container_name: mmwss-app
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql://mmwss:${MMWSS_DB_PASSWORD}@db:5432/mmwss?schema=mmwss
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://coldcalling.redotglobal.agency/mmwss}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mmwss_net
      - repo_default      # so callora-caddy can resolve "mmwss-app" by name
    volumes:
      - mmwss_reports:/app/reports:ro
    deploy:
      resources:
        limits:
          memory: 512m
