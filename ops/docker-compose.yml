# MMWSS stack — separate from the existing callora stack.
# Lives on the same EC2 host but uses its own Docker network and its own Postgres.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  mmwss_net:
    name: mmwss_net
    driver: bridge
  # Attached to callora's network too so caddy (in callora stack) can reach mmwss-app
  repo_default:
    external: true

volumes:
  mmwss_pgdata:
    name: mmwss_pgdata
  mmwss_reports:
    name: mmwss_reports
  mmwss_zap_data:
    name: mmwss_zap_data

services:
  db:
    image: postgres:15-alpine
    container_name: mmwss-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: mmwss
      POSTGRES_PASSWORD: ${MMWSS_DB_PASSWORD}
      POSTGRES_DB: mmwss
    volumes:
      - mmwss_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    networks:
      - mmwss_net
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmwss -d mmwss"]
      interval: 5s
      timeout: 5s
      retries: 10

  collector:
    build:
      context: ../collector
      dockerfile: Dockerfile
    image: mmwss/collector:latest
    container_name: mmwss-collector
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql://mmwss:${MMWSS_DB_PASSWORD}@db:5432/mmwss
      MMWSS_MASTER_KEY: ${MMWSS_MASTER_KEY}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      CLOUDFLARE_TOKEN_LABEL: ${CLOUDFLARE_TOKEN_LABEL:-primary}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
      MMWSS_PUBLIC_URL: ${MMWSS_PUBLIC_URL:-https://coldcalling.redotglobal.agency}
      WPMUDEV_USER_API_KEY: ${WPMUDEV_USER_API_KEY:-}
      ZAP_URL: ${ZAP_URL:-http://zap:8090}
      ZAP_API_KEY: ${ZAP_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mmwss_net
    volumes:
      - mmwss_reports:/app/reports
    deploy:
      resources:
        limits:
          memory: 256m

  app:
    build:
      context: ../app
      dockerfile: Dockerfile
    image: mmwss/app:latest
    container_name: mmwss-app
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql://mmwss:${MMWSS_DB_PASSWORD}@db:5432/mmwss
      MMWSS_MASTER_KEY: ${MMWSS_MASTER_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      BASE_PATH: /mmwss
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: lax
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mmwss_net
      - repo_default      # so callora-caddy can resolve "mmwss-app" by name
    volumes:
      - mmwss_reports:/app/reports:ro
    deploy:
      resources:
        limits:
          memory: 256m

  # ───── OWASP ZAP (DAST scanner daemon) ─────
  # Long-running container; collector calls its REST API on port 8090.
  # Phase 1 default: passive scan + spider only (safe, no payload injection).
  # Active mode is gated per-scanner-config and requires written authorization.
  # JVM heap capped at 768m so total container memory stays under ~1GB
  # — fits within the 3.7GB callora budget alongside db + collector + app.
  zap:
    image: zaproxy/zap-stable:latest
    container_name: mmwss-zap
    restart: unless-stopped
    logging: *default-logging
    user: zap
    environment:
      _JAVA_OPTIONS: "-Xmx768m -XX:+UseG1GC -Djava.awt.headless=true"
    command: >
      zap.sh -daemon
      -host 0.0.0.0
      -port 8090
      -config api.key=${ZAP_API_KEY}
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
      -config database.recoverylog=false
      -config connection.timeoutInSecs=30
    networks:
      - mmwss_net
    volumes:
      - mmwss_zap_data:/zap/wrk
    deploy:
      resources:
        limits:
          memory: 1100m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS \"http://localhost:8090/JSON/core/view/version/?apikey=${ZAP_API_KEY}\" > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
