<!doctype html>
<html lang="en" class="h-full bg-white">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MMWSS — Redot Global{% endblock %}</title>
  <link rel="icon" href="{{ base_path }}/static/img/favicon.svg" type="image/svg+xml">
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand:  { DEFAULT: '#E11E27', 50:'#FEF2F2', 100:'#FEE5E5', 200:'#FBC9CA', 300:'#F69EA0', 400:'#EE6669', 500:'#E11E27', 600:'#C01017', 700:'#9F0F14', 800:'#840E13', 900:'#6E0F14' },
            ink:    { DEFAULT: '#1F1F1F', muted:'#6B7280', subtle:'#9CA3AF' },
            surface:{ DEFAULT: '#FFFFFF', alt:'#F8F9FA' },
            line:   { DEFAULT: '#E5E7EB', strong:'#D1D5DB' },
          },
          fontFamily: { sans: ['system-ui','-apple-system','Segoe UI','Roboto','sans-serif'] },
        }
      }
    }
  </script>
  <style>
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #F8F9FA; }
    ::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 6px; }
    ::-webkit-scrollbar-thumb:hover { background: #9CA3AF; }
  </style>
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  {% block head_extra %}{% endblock %}
</head>
<body class="h-full antialiased text-ink">
{% block body %}{% endblock %}
</body>
</html>
