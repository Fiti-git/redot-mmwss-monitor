<!doctype html>
<html lang="en" class="h-full bg-surface-alt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MMWSS — Redot Global{% endblock %}</title>
  <link rel="icon" href="{{ base_path }}/static/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand:   { DEFAULT:'#E11E27', 50:'#FEF2F2', 100:'#FEE5E5', 200:'#FBC9CA', 300:'#F69EA0', 400:'#EE6669', 500:'#E11E27', 600:'#C01017', 700:'#9F0F14', 800:'#840E13', 900:'#6E0F14' },
            ink:     { DEFAULT:'#0F172A', muted:'#64748B', subtle:'#94A3B8' },
            surface: { DEFAULT:'#FFFFFF', alt:'#F7F8FA', sunken:'#F1F3F6' },
            line:    { DEFAULT:'#E5E7EB', strong:'#D1D5DB', subtle:'#F1F3F6' },
            ok:      { DEFAULT:'#10B981', soft:'#D1FAE5', dark:'#047857' },
            warn:    { DEFAULT:'#F59E0B', soft:'#FEF3C7', dark:'#B45309' },
            danger:  { DEFAULT:'#E11E27', soft:'#FEE5E5', dark:'#9F0F14' },
            info:    { DEFAULT:'#3B82F6', soft:'#DBEAFE', dark:'#1D4ED8' },
          },
          fontFamily: {
            sans: ['Inter','system-ui','-apple-system','Segoe UI','Roboto','sans-serif'],
            mono: ['JetBrains Mono','ui-monospace','SFMono-Regular','Menlo','Monaco','Consolas','monospace'],
          },
          boxShadow: {
            'card':  '0 1px 2px 0 rgba(15,23,42,0.04), 0 1px 3px 0 rgba(15,23,42,0.06)',
            'card-hover': '0 4px 6px -1px rgba(15,23,42,0.08), 0 2px 4px -1px rgba(15,23,42,0.04)',
            'pop':   '0 10px 15px -3px rgba(15,23,42,0.1), 0 4px 6px -2px rgba(15,23,42,0.05)',
            'inset-soft': 'inset 0 1px 0 0 rgba(255,255,255,0.6)',
          },
          borderRadius: { 'xl2': '14px' },
        }
      }
    }
  </script>
  <style>
    html, body { font-family: 'Inter', system-ui, sans-serif; }
    body { font-feature-settings: 'cv02','cv03','cv04','cv11'; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #F7F8FA; }
    ::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 6px; border: 2px solid #F7F8FA; }
    ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
    .tabular { font-variant-numeric: tabular-nums; }
  </style>
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  {% block head_extra %}{% endblock %}
</head>
<body class="h-full antialiased text-ink bg-surface-alt">
{% block body %}{% endblock %}
</body>
</html>
