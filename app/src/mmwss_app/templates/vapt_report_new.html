{% extends "_app_shell.html" %}
{% block title %}New VAPT report — MMWSS{% endblock %}

{% block app_main %}
<div class="max-w-[760px]">
  <div class="mb-6">
    <div class="text-[12px] text-ink-muted mb-1">
      <a href="{{ base_path }}/vapt" class="hover:text-brand">VAPT</a> / New report
    </div>
    <h1 class="text-[24px] font-bold text-ink tracking-tight">New VAPT report</h1>
    <p class="text-[13.5px] text-ink-muted mt-1">Register a VAPT assessment so its findings can be tracked, remediated, and verified within SLA.</p>
  </div>

  <form method="post" action="{{ base_path }}/vapt/reports/new" class="bg-white border border-line rounded-xl2 shadow-card p-6 space-y-5">
    <div>
      <label class="block text-[13px] font-semibold text-ink mb-1.5">Title</label>
      <input name="title" type="text" required maxlength="200"
             placeholder="e.g., Q3 2026 VAPT Assessment"
             class="w-full h-11 px-3.5 bg-white border border-line rounded-lg text-[14px] text-ink focus:outline-none focus:ring-2 focus:ring-brand-200 focus:border-brand">
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-[13px] font-semibold text-ink mb-1.5">Vendor</label>
        <input name="vendor" type="text" maxlength="200"
               placeholder="e.g., SISA Information Security"
               class="w-full h-11 px-3.5 bg-white border border-line rounded-lg text-[14px] text-ink focus:outline-none focus:ring-2 focus:ring-brand-200 focus:border-brand">
      </div>
      <div>
        <label class="block text-[13px] font-semibold text-ink mb-1.5">Report date</label>
        <input name="report_date" type="date"
               class="w-full h-11 px-3.5 bg-white border border-line rounded-lg text-[14px] text-ink focus:outline-none focus:ring-2 focus:ring-brand-200 focus:border-brand">
      </div>
    </div>
    <div>
      <label class="block text-[13px] font-semibold text-ink mb-1.5">Notes</label>
      <textarea name="notes" rows="4"
                placeholder="Scope, methodology, special considerations…"
                class="w-full px-3.5 py-2.5 bg-white border border-line rounded-lg text-[13.5px] text-ink focus:outline-none focus:ring-2 focus:ring-brand-200 focus:border-brand"></textarea>
    </div>
    <div class="flex items-center gap-3 pt-2 border-t border-line">
      <a href="{{ base_path }}/vapt" class="h-10 px-4 inline-flex items-center text-[13px] font-semibold text-ink-muted hover:text-ink">Cancel</a>
      <button type="submit" class="h-10 px-5 bg-brand hover:bg-brand-600 text-white font-semibold text-[13px] rounded-md shadow-card">Create report</button>
    </div>
  </form>
</div>
{% endblock %}
