<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>{{ r.type | title }} report · {{ r.period_start | date_only }} — MMWSS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <!-- PDF.js — renders PDF pages to canvases -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- StPageFlip — realistic 3D page flip -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

  <style>
    :root {
      --paper:        #fbf8f1;
      --paper-edge:   #d4ccba;
      --paper-shadow: rgba(0, 0, 0, 0.35);
      --ink:          #181818;
      --brand:        #E11E27;
      --bg-1:         #1a1410;
      --bg-2:         #0d0a08;
      --leather:      #2a1f18;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', -apple-system, sans-serif;
      color: #e8e2d5;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background:
        radial-gradient(ellipse at center, rgba(255,220,170,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at top, var(--bg-1) 0%, var(--bg-2) 100%);
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
    }

    /* Subtle wood-grain noise so the desk surface looks real */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.12;
      background-image:
        repeating-linear-gradient(135deg,
          rgba(120, 80, 40, 0.15) 0px,
          rgba(120, 80, 40, 0.15) 1px,
          transparent 1px,
          transparent 4px);
      mix-blend-mode: overlay;
      z-index: 0;
    }

    /* Top bar */
    header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 28px;
      backdrop-filter: blur(8px);
      background: rgba(0, 0, 0, 0.25);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .crumb { display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .crumb a { color: #b8ad95; text-decoration: none; transition: color 0.15s; }
    .crumb a:hover { color: var(--brand); }
    .crumb .sep { color: #5a4f3e; }
    .crumb .title-current { color: #fbf8f1; font-weight: 500; letter-spacing: 0.01em; }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      width: 36px; height: 36px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 8px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      color: #d6cdb8;
      cursor: pointer;
      transition: all 0.15s;
    }
    .icon-btn:hover { background: rgba(225,30,39,0.15); border-color: rgba(225,30,39,0.4); color: #fff; }
    .icon-btn.on  { background: rgba(225,30,39,0.2); border-color: rgba(225,30,39,0.5); color: #fff; }
    .icon-btn svg { width: 18px; height: 18px; }

    /* Book stage */
    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      perspective: 2400px;
      z-index: 1;
      overflow: hidden;
    }

    /* Ambient lamp glow above the book */
    .stage::before {
      content: "";
      position: absolute;
      top: -150px;
      left: 50%;
      transform: translateX(-50%);
      width: 1200px;
      height: 600px;
      background: radial-gradient(ellipse, rgba(255, 200, 130, 0.12), transparent 70%);
      pointer-events: none;
    }

    #book-wrapper {
      position: relative;
      will-change: transform;
      opacity: 0;
      transform: translateY(8px) scale(0.98);
      transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }
    #book-wrapper.ready {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* The book casts a soft floor shadow that scales with size */
    #book-wrapper::after {
      content: "";
      position: absolute;
      left: 5%;
      right: 5%;
      bottom: -22px;
      height: 32px;
      background: radial-gradient(ellipse, rgba(0,0,0,0.65), transparent 70%);
      filter: blur(8px);
      pointer-events: none;
    }

    /* Each page = subtle paper texture, vignette, fine grain, rounded corners */
    .page {
      background: var(--paper);
      background-image:
        radial-gradient(ellipse at 50% 50%, transparent 60%, rgba(0,0,0,0.08) 100%),
        repeating-linear-gradient(0deg, transparent 0px, transparent 3px, rgba(0,0,0,0.012) 3px, rgba(0,0,0,0.012) 4px);
      color: var(--ink);
      border: 1px solid var(--paper-edge);
      border-radius: 10px;          /* soft book-quality corner */
      box-shadow:
        inset 0 0 60px rgba(150, 130, 90, 0.05),
        0 1px 0 rgba(255,255,255,0.4);
      overflow: hidden;
      position: relative;
      will-change: transform;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);     /* promote to its own layer for smoother flip */
    }
    .page img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      filter: contrast(1.02) saturate(0.97);
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      border-radius: inherit;
    }

    /* StPageFlip internal wrappers — round them too so the curl renders cleanly */
    .stf__item, .stf__block { border-radius: 10px; overflow: hidden; }
    .stf__parent { will-change: transform; }

    /* The cover (page 0) gets brand styling so it feels like a book jacket */
    .page.cover {
      background: linear-gradient(135deg, var(--leather) 0%, #1a120c 100%);
      color: #fbf8f1;
      border: 1px solid #5a3f2a;
      border-radius: 12px;
      box-shadow:
        inset 0 0 80px rgba(0,0,0,0.5),
        inset 0 0 2px rgba(255,200,150,0.15);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 64px 48px;
      font-family: 'Playfair Display', serif;
    }
    .cover-mark {
      width: 56px; height: 56px;
      border-radius: 8px;
      background: var(--brand);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Inter', sans-serif;
      font-weight: 800;
      color: #fff;
      font-size: 24px;
      letter-spacing: -0.04em;
      box-shadow: 0 4px 20px rgba(225,30,39,0.5);
    }
    .cover-title {
      font-size: 44px;
      line-height: 1.1;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .cover-subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #c4a888;
      margin-bottom: 10px;
    }
    .cover-foot {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      color: #998366;
      letter-spacing: 0.02em;
      display: flex;
      justify-content: space-between;
      align-items: end;
    }
    .cover-foot .brand-text { color: #d4b896; font-weight: 600; letter-spacing: 0.04em; }

    /* Loading state */
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-2);
      z-index: 100;
      transition: opacity 0.6s;
    }
    #loader.hide { opacity: 0; pointer-events: none; }
    .spinner {
      width: 36px; height: 36px;
      border: 2.5px solid rgba(225,30,39,0.2);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loader .label { margin-top: 18px; font-size: 12.5px; color: #9d8e72; letter-spacing: 0.06em; text-transform: uppercase; }

    /* Footer bar with controls */
    footer {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 16px 24px;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(6px);
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .pg-info {
      font-size: 12px;
      color: #b8ad95;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-variant-numeric: tabular-nums;
      min-width: 90px;
      text-align: center;
    }
    .pg-info b { color: #fbf8f1; font-weight: 600; }

    /* Keyboard hint */
    .hint {
      position: fixed;
      bottom: 76px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #6e6354;
      pointer-events: none;
      opacity: 0;
      animation: fadeHint 5s ease-in-out 1s forwards;
    }
    @keyframes fadeHint {
      0%, 12%   { opacity: 0; }
      18%, 70%  { opacity: 1; }
      100%      { opacity: 0; }
    }

    @media (max-width: 768px) {
      .cover-title { font-size: 28px; }
      .cover-mark { width: 44px; height: 44px; font-size: 19px; }
      header { padding: 12px 16px; }
      .crumb { font-size: 12px; }
    }
  </style>
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
    <div class="label">Preparing report…</div>
  </div>

  <header>
    <div class="crumb">
      <a href="{{ base_path }}/reports">← Reports</a>
      <span class="sep">/</span>
      <span class="title-current">{{ r.type | title }} · {{ r.period_start | date_only }} → {{ r.period_end | date_only }}</span>
    </div>
    <div class="header-actions">
      <button id="sound-toggle" class="icon-btn on" title="Toggle page-turn sound">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19"/>
          <path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/>
        </svg>
      </button>
      <button id="fullscreen-toggle" class="icon-btn" title="Fullscreen (F)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 00-2 2v3M21 8V5a2 2 0 00-2-2h-3M3 16v3a2 2 0 002 2h3M16 21h3a2 2 0 002-2v-3"/>
        </svg>
      </button>
      <a class="icon-btn" href="{{ base_path }}/reports/{{ r.id }}/pdf" download title="Download PDF">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>
        </svg>
      </a>
    </div>
  </header>

  <div class="stage">
    <div id="book-wrapper"></div>
    <div class="hint">← →   turn page   ·   F   fullscreen   ·   M   mute</div>
  </div>

  <footer>
    <button id="prev" class="icon-btn" title="Previous (←)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <div class="pg-info"><b id="pg-current">1</b> / <span id="pg-total">…</span></div>
    <button id="next" class="icon-btn" title="Next (→)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>
  </footer>

  <script>
    // ───── PDF.js setup ─────
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    const PDF_URL = "{{ base_path }}/reports/{{ r.id }}/pdf";

    // ───── Page-flip sound — synthesised, no asset dependency ─────
    let audioCtx = null;
    let soundOn = true;
    function ensureAudio() {
      if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch (e) { audioCtx = null; }
      }
    }
    function playFlip() {
      if (!soundOn || !audioCtx) return;
      const now = audioCtx.currentTime;
      // Two short noise bursts — initial paper "thwip" + tail rustle.
      const make = (t0, dur, peak, hp, lp) => {
        const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < data.length; i++) {
          // Pinkish noise — drop high frequencies a bit
          data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 1.7);
        }
        const src = audioCtx.createBufferSource();
        src.buffer = buf;
        const bp = audioCtx.createBiquadFilter();
        bp.type = "bandpass"; bp.frequency.value = (hp + lp) / 2; bp.Q.value = 0.7;
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0, now + t0);
        gain.gain.linearRampToValueAtTime(peak, now + t0 + 0.005);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + t0 + dur);
        src.connect(bp); bp.connect(gain); gain.connect(audioCtx.destination);
        src.start(now + t0); src.stop(now + t0 + dur);
      };
      make(0,    0.06, 0.18, 1600, 3800);   // softer initial paper snap
      make(0.05, 0.28, 0.09,  500, 2000);   // gentle rustle tail
    }

    // ───── Render PDF → image data URLs sized for the book ─────
    async function renderPdfToImages(pdfUrl, targetWidth) {
      const pdf = await pdfjsLib.getDocument(pdfUrl).promise;
      const pages = [];
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const viewport = page.getViewport({ scale: 1 });
        const scale = targetWidth / viewport.width;
        const v2 = page.getViewport({ scale: Math.max(1.5, scale) });
        const canvas = document.createElement("canvas");
        canvas.width = v2.width; canvas.height = v2.height;
        const ctx = canvas.getContext("2d");
        await page.render({ canvasContext: ctx, viewport: v2 }).promise;
        pages.push(canvas.toDataURL("image/jpeg", 0.88));
      }
      return { pages, aspect: pdf.numPages > 0
        ? (await (await pdf.getPage(1)).getViewport({ scale: 1 })).height /
          (await pdf.getPage(1)).getViewport({ scale: 1 }).width
        : 1.414 };
    }

    // ───── Compute book dimensions to fit the viewport ─────
    function computeBookSize() {
      const stage = document.querySelector(".stage");
      const w = stage.clientWidth;
      const h = stage.clientHeight;
      // Two pages side by side, plus 4% gap; height = page * 1.414 (A4 ratio)
      const maxW = Math.min(w * 0.92, 1400);
      const maxH = h * 0.92;
      // page width based on width vs height constraint
      let pageW = maxW / 2;
      if (pageW * 1.414 > maxH) pageW = maxH / 1.414;
      const pageH = pageW * 1.414;
      return { pageW: Math.floor(pageW), pageH: Math.floor(pageH) };
    }

    // ───── Build cover page DOM ─────
    function buildCover(pageW, pageH) {
      const el = document.createElement("div");
      el.className = "page cover";
      el.style.width = pageW + "px";
      el.style.height = pageH + "px";
      el.innerHTML = `
        <div>
          <div class="cover-mark">R</div>
        </div>
        <div>
          <div class="cover-subtitle">{{ r.type | upper }} REPORT</div>
          <div class="cover-title">{{ r.period_label or (r.period_start | date_only ~ ' — ' ~ r.period_end | date_only) }}</div>
        </div>
        <div class="cover-foot">
          <div>
            <div style="font-size:11px;color:#7a6b55;letter-spacing:0.16em;text-transform:uppercase;margin-bottom:4px">Prepared by</div>
            <div class="brand-text">Redot Global · MMWSS Security &amp; Uptime Platform</div>
          </div>
          <div style="text-align:right;font-size:11px;color:#7a6b55;letter-spacing:0.12em">
            <div>Generated</div>
            <div style="color:#d4b896;margin-top:2px">{{ r.generated_at | datetime_str }}</div>
          </div>
        </div>
      `;
      return el;
    }

    // ───── Build a regular content page that contains a PDF page image ─────
    function buildPage(imgSrc, pageW, pageH) {
      const el = document.createElement("div");
      el.className = "page";
      el.style.width = pageW + "px";
      el.style.height = pageH + "px";
      const img = new Image();
      img.src = imgSrc;
      img.alt = "Report page";
      el.appendChild(img);
      return el;
    }

    // ───── Initialise the flipbook ─────
    let flip = null;
    async function init() {
      const { pageW, pageH } = computeBookSize();
      const { pages: pdfPages } = await renderPdfToImages(PDF_URL, pageW * 2);

      const wrapper = document.getElementById("book-wrapper");
      wrapper.innerHTML = "";

      // Build DOM pages: cover + pdf pages + back cover
      const allPages = [buildCover(pageW, pageH)];
      for (const src of pdfPages) allPages.push(buildPage(src, pageW, pageH));

      // Even page count looks better on a flipbook (back cover blank)
      if (allPages.length % 2 === 1) {
        const blank = document.createElement("div");
        blank.className = "page";
        blank.style.width = pageW + "px";
        blank.style.height = pageH + "px";
        allPages.push(blank);
      }

      // page-flip needs an element with all .page children inside
      const bookEl = document.createElement("div");
      bookEl.id = "book";
      bookEl.style.width = (pageW * 2) + "px";
      bookEl.style.height = pageH + "px";
      allPages.forEach(p => bookEl.appendChild(p));
      wrapper.appendChild(bookEl);

      flip = new St.PageFlip(bookEl, {
        width: pageW,
        height: pageH,
        size: "fixed",
        minWidth: 280,
        minHeight: 400,
        maxShadowOpacity: 0.45,         // softer, less harsh shadow during flip
        showCover: true,
        usePortrait: window.innerWidth < 900,
        mobileScrollSupport: false,
        drawShadow: true,
        flippingTime: 1200,             // longer = silkier transition
        useMouseEvents: true,
        swipeDistance: 18,              // smaller threshold = more responsive drag
        clickEventForward: false,
        showPageCorners: true,          // visible curl-on-hover hint
        disableFlipByClick: false,
      });
      flip.loadFromHTML(document.querySelectorAll("#book .page"));

      document.getElementById("pg-total").textContent = flip.getPageCount();
      flip.on("flip", e => {
        document.getElementById("pg-current").textContent = e.data + 1;
        playFlip();
      });

      // Reveal book first, then fade loader
      requestAnimationFrame(() => {
        document.getElementById("book-wrapper").classList.add("ready");
        setTimeout(() => {
          document.getElementById("loader").classList.add("hide");
        }, 250);
      });
    }

    // ───── Controls ─────
    document.getElementById("prev").addEventListener("click", () => flip && flip.flipPrev());
    document.getElementById("next").addEventListener("click", () => flip && flip.flipNext());
    document.getElementById("sound-toggle").addEventListener("click", function () {
      soundOn = !soundOn;
      this.classList.toggle("on", soundOn);
    });
    document.getElementById("fullscreen-toggle").addEventListener("click", () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    });
    window.addEventListener("keydown", (e) => {
      if (!flip) return;
      if (e.key === "ArrowLeft") flip.flipPrev();
      else if (e.key === "ArrowRight") flip.flipNext();
      else if (e.key === "f" || e.key === "F") {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
      } else if (e.key === "m" || e.key === "M") {
        soundOn = !soundOn;
        document.getElementById("sound-toggle").classList.toggle("on", soundOn);
      }
    });

    // Audio context needs a user gesture; create on first interaction
    document.addEventListener("click", ensureAudio, { once: true });
    document.addEventListener("keydown", ensureAudio, { once: true });

    // Re-layout on resize/orientation
    let resizeTimer = null;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (flip) {
          const { pageW, pageH } = computeBookSize();
          flip.update({ width: pageW, height: pageH });
        }
      }, 200);
    });

    init().catch(err => {
      console.error(err);
      document.getElementById("loader").innerHTML =
        `<div style="color:#cf6c6c;font-size:13px">Could not load PDF: ${err.message}</div>`;
    });
  </script>
</body>
</html>
